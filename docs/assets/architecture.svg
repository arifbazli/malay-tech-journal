<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="660" viewBox="0 0 1280 660" role="img" aria-labelledby="title desc">
  <title id="title">Malay Tech Journal architecture</title>
  <desc id="desc">A post moves through four stages. Write: bilingual Markdown posts with a shared translation key, validated by a Zod schema, optionally drafted by a research pipeline. Verify: a pull request runs lint, type, test and build checks, merges to main, and the publish label flips draft to false. Build: Astro 7 on Bun renders static pages for both locales, Satori share images, a Projects page from the GitHub API, a Pagefind search index, RSS and sitemaps. Deliver: Wrangler deploys to Cloudflare Pages on every push to main and once a day, with security headers, serving Bahasa Melayu at the root and English under /en/. Weekly jobs, a Bun version monitor and Dependabot keep the repository healthy.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#121521"/>
      <stop offset="1" stop-color="#0b0d14"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="0.35" stop-color="#5b8fff"/>
      <stop offset="0.68" stop-color="#34d399"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8b91b3"/>
    </marker>
    <style>
      .sans { font-family: Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .mono { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .h1 { font-size: 24px; font-weight: 700; fill: #e2e4ef; }
      .lede { font-size: 14px; fill: #8b91b3; }
      .step { font-size: 11px; font-weight: 700; letter-spacing: 1.6px; }
      .colTitle { font-size: 17px; font-weight: 700; fill: #e2e4ef; }
      .colSub { font-size: 12px; fill: #8b91b3; }
      .itemTitle { font-size: 14.5px; font-weight: 600; fill: #e2e4ef; }
      .itemSub { font-size: 11.5px; fill: #8b91b3; }
      .card { fill: #16181f; stroke: #2a2d3e; stroke-width: 1; }
      .item { fill: #1e2130; stroke: #2a2d3e; stroke-width: 1; }
      .chipText { font-size: 12px; fill: #c9cce0; }
    </style>
  </defs>

  <rect width="1280" height="660" rx="22" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="1279" height="659" rx="22" fill="none" stroke="#2a2d3e"/>

  <!-- Heading -->
  <text x="40" y="54" class="sans h1">Malay Tech Journal — from Markdown to the edge</text>
  <text x="40" y="80" class="sans lede">Bilingual (BM / EN) static site · Astro 7 on Bun · every change gated by a pull request · served by Cloudflare Pages</text>
  <rect x="40" y="96" width="1200" height="3" rx="1.5" fill="url(#flow)" opacity="0.9"/>

  <!-- ============ Column 1: WRITE ============ -->
  <g>
    <rect x="40" y="124" width="270" height="388" rx="16" class="card"/>
    <rect x="60" y="124" width="80" height="3" rx="1.5" fill="#a78bfa"/>
    <text x="60" y="156" class="sans step" fill="#a78bfa">01 · WRITE</text>
    <text x="60" y="180" class="sans colTitle">Content</text>
    <text x="60" y="198" class="sans colSub">Markdown, paired by language</text>

    <rect x="54" y="214" width="242" height="64" rx="10" class="item"/>
    <text x="70" y="240" class="sans itemTitle">Markdown posts</text>
    <text x="70" y="261" class="mono itemSub">src/content/posts/{ms,en}</text>

    <rect x="54" y="286" width="242" height="64" rx="10" class="item"/>
    <text x="70" y="312" class="sans itemTitle">EN ↔ MS pairs</text>
    <text x="70" y="333" class="mono itemSub">shared translationKey</text>

    <rect x="54" y="358" width="242" height="64" rx="10" class="item"/>
    <text x="70" y="384" class="sans itemTitle">Zod content schema</text>
    <text x="70" y="405" class="mono itemSub">src/content.config.ts</text>

    <rect x="54" y="430" width="242" height="64" rx="10" class="item"/>
    <text x="70" y="456" class="sans itemTitle">Research pipeline</text>
    <text x="70" y="477" class="mono itemSub">/write-post → PR, draft: true</text>
  </g>

  <!-- ============ Column 2: VERIFY ============ -->
  <g>
    <rect x="350" y="124" width="270" height="388" rx="16" class="card"/>
    <rect x="370" y="124" width="80" height="3" rx="1.5" fill="#5b8fff"/>
    <text x="370" y="156" class="sans step" fill="#5b8fff">02 · VERIFY</text>
    <text x="370" y="180" class="sans colTitle">GitHub</text>
    <text x="370" y="198" class="sans colSub">Nothing reaches main unchecked</text>

    <rect x="364" y="214" width="242" height="64" rx="10" class="item"/>
    <text x="380" y="240" class="sans itemTitle">Pull request</text>
    <text x="380" y="261" class="mono itemSub">feature branch → main</text>

    <rect x="364" y="286" width="242" height="64" rx="10" class="item"/>
    <text x="380" y="312" class="sans itemTitle">PR checks</text>
    <text x="380" y="333" class="mono itemSub">lint · types · tests · build</text>

    <rect x="364" y="358" width="242" height="64" rx="10" class="item"/>
    <text x="380" y="384" class="sans itemTitle">Merge to main</text>
    <text x="380" y="405" class="mono itemSub">triggers the deploy</text>

    <rect x="364" y="430" width="242" height="64" rx="10" class="item"/>
    <text x="380" y="456" class="sans itemTitle">publish label</text>
    <text x="380" y="477" class="mono itemSub">publish-on-merge → draft: false</text>
  </g>

  <!-- ============ Column 3: BUILD ============ -->
  <g>
    <rect x="660" y="124" width="270" height="388" rx="16" class="card"/>
    <rect x="680" y="124" width="80" height="3" rx="1.5" fill="#34d399"/>
    <text x="680" y="156" class="sans step" fill="#34d399">03 · BUILD</text>
    <text x="680" y="180" class="sans colTitle">Astro 7 on Bun</text>
    <text x="680" y="198" class="sans colSub">Fully static output in dist/</text>

    <rect x="674" y="214" width="242" height="64" rx="10" class="item"/>
    <text x="690" y="240" class="sans itemTitle">Static pages, two locales</text>
    <text x="690" y="261" class="mono itemSub">content collections + i18n</text>

    <rect x="674" y="286" width="242" height="64" rx="10" class="item"/>
    <text x="690" y="312" class="sans itemTitle">Share images</text>
    <text x="690" y="333" class="mono itemSub">Satori → /og/&lt;slug&gt;.png</text>

    <rect x="674" y="358" width="242" height="64" rx="10" class="item"/>
    <text x="690" y="384" class="sans itemTitle">Projects page</text>
    <text x="690" y="405" class="mono itemSub">GitHub REST API at build</text>

    <rect x="674" y="430" width="242" height="64" rx="10" class="item"/>
    <text x="690" y="456" class="sans itemTitle">Search · RSS · sitemap</text>
    <text x="690" y="477" class="mono itemSub">Pagefind · per-locale feeds</text>
  </g>

  <!-- ============ Column 4: DELIVER ============ -->
  <g>
    <rect x="970" y="124" width="270" height="388" rx="16" class="card"/>
    <rect x="990" y="124" width="80" height="3" rx="1.5" fill="#38bdf8"/>
    <text x="990" y="156" class="sans step" fill="#38bdf8">04 · DELIVER</text>
    <text x="990" y="180" class="sans colTitle">Cloudflare Pages</text>
    <text x="990" y="198" class="sans colSub">Global edge, no server to run</text>

    <rect x="984" y="214" width="242" height="64" rx="10" class="item"/>
    <text x="1000" y="240" class="sans itemTitle">wrangler pages deploy</text>
    <text x="1000" y="261" class="mono itemSub">deploy-cloudflare.yml</text>

    <rect x="984" y="286" width="242" height="64" rx="10" class="item"/>
    <text x="1000" y="312" class="sans itemTitle">Triggers</text>
    <text x="1000" y="333" class="mono itemSub">push to main · daily 02:23 UTC</text>

    <rect x="984" y="358" width="242" height="64" rx="10" class="item"/>
    <text x="1000" y="384" class="sans itemTitle">Security headers</text>
    <text x="1000" y="405" class="mono itemSub">CSP · HSTS · public/_headers</text>

    <rect x="984" y="430" width="242" height="64" rx="10" class="item"/>
    <text x="1000" y="456" class="sans itemTitle">Readers</text>
    <text x="1000" y="477" class="mono itemSub">/ (BM) · /en/ (EN)</text>
  </g>

  <!-- Flow arrows between stages -->
  <line x1="314" y1="318" x2="344" y2="318" stroke="#8b91b3" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="624" y1="318" x2="654" y2="318" stroke="#8b91b3" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="934" y1="318" x2="964" y2="318" stroke="#8b91b3" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ============ Upkeep strip ============ -->
  <rect x="40" y="536" width="1200" height="92" rx="16" class="card"/>
  <text x="60" y="566" class="sans step" fill="#fbbf24">SCHEDULED UPKEEP</text>
  <text x="60" y="590" class="sans colSub">Keeps dependencies and the toolchain current between posts</text>

  <rect x="560" y="556" width="208" height="52" rx="10" class="item"/>
  <text x="576" y="578" class="sans itemTitle" style="font-size:13px">Weekly smoke build</text>
  <text x="576" y="597" class="mono itemSub" style="font-size:10.5px">weekly.yml · Mon</text>

  <rect x="784" y="556" width="208" height="52" rx="10" class="item"/>
  <text x="800" y="578" class="sans itemTitle" style="font-size:13px">Bun version monitor</text>
  <text x="800" y="597" class="mono itemSub" style="font-size:10.5px">bun-update-monitor.yml</text>

  <rect x="1008" y="556" width="208" height="52" rx="10" class="item"/>
  <text x="1024" y="578" class="sans itemTitle" style="font-size:13px">Dependabot</text>
  <text x="1024" y="597" class="mono itemSub" style="font-size:10.5px">grouped npm updates</text>
</svg>
