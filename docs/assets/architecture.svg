<svg xmlns="http://www.w3.org/2000/svg" width="880" height="690" viewBox="0 0 880 690" role="img" aria-labelledby="title desc">
  <title id="title">How Malay Tech Journal is built and published</title>
  <desc id="desc">Four stages. Write: Markdown posts in Bahasa Melayu and English, paired by translationKey and checked by a Zod schema; a research pipeline opens draft pull requests. Verify: every change is a pull request to main that runs lint, type, test and build checks; merging triggers the deploy and the publish label makes drafts go live. Build: Astro 7 on Bun renders static pages for both languages, share images, a Projects page from the GitHub API, Pagefind search, RSS and sitemaps. Deliver: Cloudflare Pages deploys on every merge and daily, with CSP and HSTS headers, serving Bahasa Melayu at / and English at /en/. Weekly builds, a Bun version monitor and Dependabot keep it maintained.</desc>
  <style>
    text { font-family: 'Segoe UI', Inter, -apple-system, Helvetica, Arial, sans-serif; }
    .title { font-size: 26px; font-weight: 700; fill: #f4f5fb; }
    .sub { font-size: 15px; fill: #b9bdd6; }
    .num { font-size: 28px; font-weight: 700; }
    .label { font-size: 13px; font-weight: 700; letter-spacing: 2px; }
    .stage { font-size: 19px; font-weight: 700; fill: #f4f5fb; }
    .chip { font-size: 15px; font-weight: 500; fill: #eceef7; }
    .card { fill: #171a24; stroke: #2f3347; stroke-width: 1.5; }
  </style>

  <rect width="880" height="690" rx="20" fill="#0f1117"/>

  <text x="32" y="50" class="title">Malay Tech Journal: how a post ships</text>
  <text x="32" y="78" class="sub">Bilingual static site · every change is a pull request · served from the Cloudflare edge</text>

  <!-- 01 WRITE -->
  <g>
    <rect x="24" y="104" width="832" height="104" rx="14" class="card"/>
    <rect x="40" y="124" width="5" height="64" rx="2.5" fill="#b69cff"/>
    <text x="60" y="148" class="num" fill="#b69cff">01</text>
    <text x="102" y="144" class="label" fill="#b69cff">WRITE</text>
    <text x="60" y="182" class="stage">Content</text>
    <rect x="272" y="120" width="282" height="34" rx="9" fill="#232739" stroke="#b69cff" stroke-opacity="0.45"/>
    <text x="286" y="142" class="chip">Markdown posts in BM + EN</text>
    <rect x="566" y="120" width="282" height="34" rx="9" fill="#232739" stroke="#b69cff" stroke-opacity="0.45"/>
    <text x="580" y="142" class="chip">Pairs linked by translationKey</text>
    <rect x="272" y="160" width="282" height="34" rx="9" fill="#232739" stroke="#b69cff" stroke-opacity="0.45"/>
    <text x="286" y="182" class="chip">Zod schema checks every post</text>
    <rect x="566" y="160" width="282" height="34" rx="9" fill="#232739" stroke="#b69cff" stroke-opacity="0.45"/>
    <text x="580" y="182" class="chip">Research pipeline → draft PR</text>
  </g>

  <path d="M92 212 L92 224 M86 219 L92 225 L98 219" stroke="#7c82a3" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 02 VERIFY -->
  <g>
    <rect x="24" y="228" width="832" height="104" rx="14" class="card"/>
    <rect x="40" y="248" width="5" height="64" rx="2.5" fill="#6f9dff"/>
    <text x="60" y="272" class="num" fill="#6f9dff">02</text>
    <text x="102" y="268" class="label" fill="#6f9dff">VERIFY</text>
    <text x="60" y="306" class="stage">GitHub</text>
    <rect x="272" y="244" width="282" height="34" rx="9" fill="#232739" stroke="#6f9dff" stroke-opacity="0.45"/>
    <text x="286" y="266" class="chip">Pull request to main</text>
    <rect x="566" y="244" width="282" height="34" rx="9" fill="#232739" stroke="#6f9dff" stroke-opacity="0.45"/>
    <text x="580" y="266" class="chip">Lint · types · tests · build</text>
    <rect x="272" y="284" width="282" height="34" rx="9" fill="#232739" stroke="#6f9dff" stroke-opacity="0.45"/>
    <text x="286" y="306" class="chip">Merge triggers the deploy</text>
    <rect x="566" y="284" width="282" height="34" rx="9" fill="#232739" stroke="#6f9dff" stroke-opacity="0.45"/>
    <text x="580" y="306" class="chip">“publish” label → post goes live</text>
  </g>

  <path d="M92 336 L92 348 M86 343 L92 349 L98 343" stroke="#7c82a3" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 03 BUILD -->
  <g>
    <rect x="24" y="352" width="832" height="104" rx="14" class="card"/>
    <rect x="40" y="372" width="5" height="64" rx="2.5" fill="#3ddc9e"/>
    <text x="60" y="396" class="num" fill="#3ddc9e">03</text>
    <text x="102" y="392" class="label" fill="#3ddc9e">BUILD</text>
    <text x="60" y="430" class="stage">Astro 7 + Bun</text>
    <rect x="272" y="368" width="282" height="34" rx="9" fill="#232739" stroke="#3ddc9e" stroke-opacity="0.45"/>
    <text x="286" y="390" class="chip">Static pages, two languages</text>
    <rect x="566" y="368" width="282" height="34" rx="9" fill="#232739" stroke="#3ddc9e" stroke-opacity="0.45"/>
    <text x="580" y="390" class="chip">Share images with Satori</text>
    <rect x="272" y="408" width="282" height="34" rx="9" fill="#232739" stroke="#3ddc9e" stroke-opacity="0.45"/>
    <text x="286" y="430" class="chip">Projects page from GitHub API</text>
    <rect x="566" y="408" width="282" height="34" rx="9" fill="#232739" stroke="#3ddc9e" stroke-opacity="0.45"/>
    <text x="580" y="430" class="chip">Search · RSS · sitemap</text>
  </g>

  <path d="M92 460 L92 472 M86 467 L92 473 L98 467" stroke="#7c82a3" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 04 DELIVER -->
  <g>
    <rect x="24" y="476" width="832" height="104" rx="14" class="card"/>
    <rect x="40" y="496" width="5" height="64" rx="2.5" fill="#4cc9f8"/>
    <text x="60" y="520" class="num" fill="#4cc9f8">04</text>
    <text x="102" y="516" class="label" fill="#4cc9f8">DELIVER</text>
    <text x="60" y="554" class="stage">Cloudflare Pages</text>
    <rect x="272" y="492" width="282" height="34" rx="9" fill="#232739" stroke="#4cc9f8" stroke-opacity="0.45"/>
    <text x="286" y="514" class="chip">Deploy on merge + daily</text>
    <rect x="566" y="492" width="282" height="34" rx="9" fill="#232739" stroke="#4cc9f8" stroke-opacity="0.45"/>
    <text x="580" y="514" class="chip">CSP + HSTS security headers</text>
    <rect x="272" y="532" width="282" height="34" rx="9" fill="#232739" stroke="#4cc9f8" stroke-opacity="0.45"/>
    <text x="286" y="554" class="chip">/  →  Bahasa Melayu</text>
    <rect x="566" y="532" width="282" height="34" rx="9" fill="#232739" stroke="#4cc9f8" stroke-opacity="0.45"/>
    <text x="580" y="554" class="chip">/en/  →  English</text>
  </g>

  <!-- UPKEEP -->
  <g>
    <rect x="24" y="600" width="832" height="66" rx="14" fill="#171a24" stroke="#2f3347" stroke-width="1.5" stroke-dasharray="6 5"/>
    <text x="44" y="639" class="label" fill="#fcc943">UPKEEP</text>
    <rect x="164" y="616" width="216" height="34" rx="9" fill="#232739" stroke="#fcc943" stroke-opacity="0.4"/>
    <text x="180" y="638" class="chip">Weekly smoke build</text>
    <rect x="398" y="616" width="216" height="34" rx="9" fill="#232739" stroke="#fcc943" stroke-opacity="0.4"/>
    <text x="414" y="638" class="chip">Bun version monitor</text>
    <rect x="632" y="616" width="216" height="34" rx="9" fill="#232739" stroke="#fcc943" stroke-opacity="0.4"/>
    <text x="648" y="638" class="chip">Dependabot updates</text>
  </g>
</svg>
