name: Sync Starter Template

on:
  workflow_run:
    workflows: ['PR Checks']
    branches: [main]
    types: [completed]
  workflow_dispatch:

# Required permissions for this workflow:
#   - contents: write   → create the sync/* branch in the upstream starter repo
#   - pull-requests: write → open a PR via `gh pr create`
# STARTER_REPO_TOKEN (secret) must have `repo` scope on kannansuresh/chirping-astro-starter.
# STARTER_REPO itself defaults to kannansuresh/chirping-astro-starter; override via the
# `vars.STARTER_REPO` org/repo variable for forks.
permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: Sync to Starter Repo (via PR)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'

    env:
      STARTER_REPO: ${{ vars.STARTER_REPO || 'kannansuresh/chirping-astro-starter' }}
      SYNC_BRANCH: sync/from-${{ github.event.repository.name }}@${{ github.sha }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          path: source

      # FIX (issue #11 / C-2): fail loudly if the upstream clone errors.
      # The previous version ran `git clone ... || { mkdir starter && git init ... }`,
      # which masked real clone failures as "repo is empty" and let the follow-up
      # `find ... -exec rm` + `git add -A` + `git push` overwrite the real public
      # upstream with a near-empty tree. Now: clone must succeed or the job aborts.
      - name: Clone upstream starter repo (fail-closed)
        shell: bash
        env:
          STARTER_TOKEN: ${{ secrets.STARTER_REPO_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${STARTER_TOKEN:-}" ]; then
            echo "::error::STARTER_REPO_TOKEN secret is not set." >&2
            exit 1
          fi

          # Stream stderr this time so transient failures are visible in the run log.
          if ! git clone "https://x-access-token:${STARTER_TOKEN}@github.com/${STARTER_REPO}.git" starter; then
            echo "::error::Failed to clone ${STARTER_REPO}. Aborting; refusing to fall back to a fresh init." >&2
            exit 1
          fi

          # Sanity: the clone must have produced an existing tree. A freshly-init'd
          # repo (the old fallback) would not have any commits.
          if ! (cd starter && git rev-parse --verify HEAD >/dev/null 2>&1); then
            echo "::error::Upstream ${STARTER_REPO} clone produced a repo with no commits. Refusing to proceed." >&2
            exit 1
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Sync files
        shell: bash
        run: |
          set -euo pipefail

          # Clean starter (preserve .git)
          find starter -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +

          # Copy explicitly included items from .starter-include
          while IFS= read -r pattern || [ -n "$pattern" ]; do
            # Ignore empty lines and comments
            [[ -z "$pattern" || "$pattern" =~ ^# ]] && continue

            # Since pattern might be a glob (like .prettierrc*), we expand it
            for file in source/$pattern; do
              [ -e "$file" ] || continue
              cp -r "$file" starter/
            done
          done < source/.starter-include

          # Copy core project files
          # Strip Husky and lint-staged from the starter's package.json
          jq 'del(.scripts.prepare, .devDependencies.husky, .devDependencies["lint-staged"], ."lint-staged")' source/package.json > starter/package.json

          # Regenerate bun.lock so it matches the rewritten starter package.json
          (cd starter && bun install --lockfile-only)

          # Copy .env.example (without CI-only flags)
          grep -v '^CI_SKIP_' source/.env.example > starter/.env.example || cp source/.env.example starter/.env.example

          # Remove demo posts (replaced by starter sample)
          rm -rf starter/src/content/posts/en/*
          rm -rf starter/src/content/posts/fr/*

          # Copy starter-specific content
          cp source/.starter/content/posts/en/getting-started.md starter/src/content/posts/en/
          cp source/.starter/content/posts/fr/getting-started.md starter/src/content/posts/fr/

          # Copy starter README (replaces main repo README)
          cp source/.starter/README.md starter/README.md

          # Copy starter-specific deploy workflow
          mkdir -p starter/.github/workflows
          cp source/.starter/workflows/deploy.yml starter/.github/workflows/deploy.yml

      # FIX (issue #12 / C-3): stop pushing directly to main on the upstream repo.
      # Push to a sync/* branch and open a PR for human review instead. The PR
      # body includes the source SHA so reviewers can trace what triggered the sync.
      - name: Push to sync branch
        shell: bash
        env:
          STARTER_TOKEN: ${{ secrets.STARTER_REPO_TOKEN }}
        working-directory: starter
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Re-point origin to the parameterized repo (clone above already used STARTER_REPO,
          # but this keeps the remote URL explicit for the push step).
          git remote set-url origin "https://x-access-token:${STARTER_TOKEN}@github.com/${STARTER_REPO}.git"

          # Checkout the sync branch off the upstream default.
          git fetch origin main
          git checkout -b "${SYNC_BRANCH}" origin/main

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to sync."
            exit 0
          fi

          git commit -m "sync: update from ${GITHUB_REPOSITORY}@${GITHUB_SHA::7} [skip ci]"

          # Push the branch only — never the upstream default branch.
          git push -u origin "${SYNC_BRANCH}"

      - name: Open sync PR
        shell: bash
        env:
          STARTER_TOKEN: ${{ secrets.STARTER_REPO_TOKEN }}
          GH_TOKEN: ${{ secrets.STARTER_REPO_TOKEN }}
        run: |
          set -euo pipefail

          # `gh pr create` requires a token in GH_TOKEN; reuse STARTER_REPO_TOKEN
          # since it must already have `repo` scope on the upstream to push.
          PR_URL=$(gh pr create \
            --repo "${STARTER_REPO}" \
            --base main \
            --head "${SYNC_BRANCH}" \
            --title "sync: update from ${GITHUB_REPOSITORY}@${GITHUB_SHA::7}" \
            --body "Automated sync from [\`${GITHUB_REPOSITORY}\`@${GITHUB_SHA::7}](https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}). Triggered by \`${GITHUB_EVENT_NAME}\`. Please review the diff before merging." \
            2>&1) || {
              echo "::error::gh pr create failed. Branch ${SYNC_BRANCH} was pushed but no PR was opened." >&2
              echo "${PR_URL}" >&2
              exit 1
            }

          echo "Sync PR opened: ${PR_URL}"