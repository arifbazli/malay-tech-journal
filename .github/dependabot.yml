# Dependabot configuration for the Astro v7 / Bun project.
# https://docs.github.com/en/code-security/dependabot/dependabot-security-updates/configuring-dependabot
version: 2

updates:
  # Weekly cadence to keep PR noise low. PRs are reviewed and merged
  # manually — no auto-merge workflow for this repo.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "npm"
    groups:
      production-dependencies:
        dependency-type: "production"
      development-dependencies:
        dependency-type: "development"
    ignore:
      # Major Astro versions are usually breaking; let a human drive those.
      - dependency-name: "astro"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@astrojs/*"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 isn't supported yet by @astrojs/check (peer dep
      # ^5 || ^6) or typescript-eslint — pinned to ^6 in PR #34. Remove
      # this ignore once both upstream packages add TS7 support.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
